apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-scratch
  namespace: northline
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: northline
spec:
  selector:
    app: northline
    component: api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: northline
spec:
  selector:
    app: northline
    component: worker
  ports:
    - port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: northline
spec:
  selector:
    app: northline
    component: web
  ports:
    - port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: northline
spec:
  selector:
    app: northline
    component: postgres
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: billing-preview
  namespace: northline
spec:
  selector:
    app: northline
    component: billing
  ports:
    - port: 80
