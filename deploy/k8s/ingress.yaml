apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: northline
  namespace: northline
spec:
  rules:
    - host: api.northline.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
    - host: app.northline.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
