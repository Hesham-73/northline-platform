services:
  api:
    image: ghcr.io/hesham-73/northline-api:1.4.0
    build:
      context: services/api
      dockerfile: Dockerfile
    depends_on:
      - worker
      - postgres
    networks:
      - app
    volumes:
      - api-tmp:/tmp/northline
  worker:
    image: ghcr.io/hesham-73/northline-worker:1.4.0
    build:
      context: services/worker
      dockerfile: Dockerfile
    depends_on:
      - postgres
    networks:
      - app
  web:
    image: ghcr.io/hesham-73/northline-web:1.4.0
    build: services/web
    depends_on:
      - api
    networks:
      - edge
      - app
  postgres:
    image: postgres:16.4
    networks:
      - app
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  api-tmp:
  pg-data:

networks:
  app:
  edge:
